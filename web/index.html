<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sistema de Gerenciamento de Obrigações">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Obrigações">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gerenciamento de Obrigações</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload brand font so ThemeData does not wait on runtime google_fonts fetch. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #F3F6F7;
    }

    /* Hide Flutter's default thin progress bar while our splash is visible. */
    .flutter-loader,
    flt-glass-pane + .loading,
    .loading[flt-renderer] {
      display: none !important;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(15, 76, 92, 0.08), transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(201, 120, 43, 0.08), transparent 45%),
        #F3F6F7;
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #142126;
      transition: opacity 280ms ease, visibility 280ms ease;
    }

    #app-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #app-loading .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 28px 32px;
      text-align: center;
    }

    #app-loading .mark {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #0F4C5C;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      box-shadow: 0 10px 28px rgba(15, 76, 92, 0.22);
    }

    #app-loading .title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    #app-loading .subtitle {
      margin: 0;
      font-size: 0.92rem;
      color: #5B6B73;
      min-height: 1.2em;
    }

    #app-loading .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.5px solid rgba(15, 76, 92, 0.18);
      border-top-color: #0F4C5C;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #0B171C; }
      #app-loading {
        background:
          radial-gradient(ellipse at 20% 10%, rgba(94, 180, 196, 0.12), transparent 50%),
          radial-gradient(ellipse at 80% 90%, rgba(240, 180, 90, 0.08), transparent 45%),
          #0B171C;
        color: #E8EEF1;
      }
      #app-loading .subtitle { color: #9AADB6; }
      #app-loading .spinner {
        border-color: rgba(94, 180, 196, 0.22);
        border-top-color: #5EB4C4;
      }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite" aria-label="Carregando aplicativo">
    <div class="panel">
      <div class="mark" aria-hidden="true">GO</div>
      <p class="title">Gerenciamento de Obrigações</p>
      <p class="subtitle">Baixando o aplicativo…</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Custom bootstrap (web/flutter_bootstrap.js) keeps splash until first Flutter frame. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
